name: Release Verification & Asset Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify Checksums & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS Assets
        run: |
          git lfs pull
          ls -lh jarvis.dmg

      - name: Verify SHA-256 Checksum
        run: |
          shasum -a 256 -c SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "J.A.R.V.I.S. Mark 54 for macOS (${{ github.ref_name }})"
          files: |
            jarvis.dmg
            SHA256SUMS
            .github/assets/logo.png
          draft: false
          prerelease: false
          generate_release_notes: true
